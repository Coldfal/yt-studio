name: Bug report
description: Report a reproducible problem without sensitive data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, OAuth tokens, cookies, databases, private media, or unredacted logs."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, Node version, FFmpeg version"
    validations:
      required: true
